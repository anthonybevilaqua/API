<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>

    <!-- Link para o jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 50px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            display: none;
            margin-top: 20px;
        }

        #downloadPdf {
            display: none;
            margin-top: 20px;
            background-color: #28a745;
        }

        #downloadPdf:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Consulta de CEP</h1>
        <input type="text" id="cep" placeholder="Digite o CEP (ex: 01001-000)" />
        <button onclick="consultarCEP()">Consultar</button>
        
        <div id="resultado" class="resultado">
            <p><strong>Logradouro:</strong> <span id="logradouro"></span></p>
            <p><strong>Bairro:</strong> <span id="bairro"></span></p>
            <p><strong>Cidade:</strong> <span id="cidade"></span></p>
            <p><strong>Estado:</strong> <span id="uf"></span></p>
        </div>

        <button id="downloadPdf" onclick="gerarPDF()">Baixar PDF</button>
    </div>

    <script>
        async function consultarCEP() {
            const cep = document.getElementById("cep").value.replace("-", ""); // Remover o hífen
            const resultadoDiv = document.getElementById("resultado");
            const downloadPdfBtn = document.getElementById("downloadPdf");

            if (!cep || cep.length !== 8) {
                alert("Por favor, insira um CEP válido!");
                return;
            }

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) {
                    alert("CEP não encontrado!");
                    return;
                }

                // Exibir os resultados na tela
                document.getElementById("logradouro").textContent = data.logradouro;
                document.getElementById("bairro").textContent = data.bairro;
                document.getElementById("cidade").textContent = data.localidade;
                document.getElementById("uf").textContent = data.uf;

                resultadoDiv.style.display = "block";
                downloadPdfBtn.style.display = "inline-block"; // Mostrar botão para gerar PDF
            } catch (error) {
                alert("Erro ao consultar o CEP.");
            }
        }

        function gerarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const logradouro = document.getElementById("logradouro").textContent;
            const bairro = document.getElementById("bairro").textContent;
            const cidade = document.getElementById("cidade").textContent;
            const uf = document.getElementById("uf").textContent;

            doc.text(`Consulta de CEP`, 20, 20);
            doc.text(`Logradouro: ${logradouro}`, 20, 30);
            doc.text(`Bairro: ${bairro}`, 20, 40);
            doc.text(`Cidade: ${cidade}`, 20, 50);
            doc.text(`Estado: ${uf}`, 20, 60);

            // Salvar o PDF
            doc.save("consulta_cep.pdf");
        }
    </script>
</body>
</html>
